<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Zenzei OS — A space-themed web desktop with glassmorphic aesthetics and interactive applications." />

  <title>Zenzei OS — Workspace</title>

  <!-- Typography: Inter for general UI, Orbitron for sci-fi headers, Fira Code for terminal -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

  <!-- FontAwesome Icons for app shortcuts, system controls, and tray indicators -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Main Application Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Dynamic starfield canvas background rendered via JavaScript -->
  <canvas id="starfield-canvas"></canvas>

  <!-- Visual atmospheric overlay to create nebula glow effects -->
  <div id="nebula-overlay"></div>

  <!-- Boot sequence screen -->
  <section id="bootloader-screen" class="system-overlay">
    <div class="boot-logo-container">
      <img
        src="logo.jpg"
        alt="Zenzei OS Logo"
        class="boot-logo"
        onerror="this.src='https://placehold.co/160x160/090911/00f3ff?text=Z'"
      />
      <h1 class="boot-title">ZENZEI<span>OS</span></h1>
    </div>

    <div class="boot-progress-wrapper">
      <div id="boot-progress-bar" class="boot-progress-bar"></div>
    </div>

    <p id="boot-status-message" class="boot-status">Initializing kernel...</p>
  </section>

  <!-- System Lockscreen -->
  <section id="lockscreen" class="system-overlay hidden">
    <header class="lockscreen-time-container">
      <div id="lockscreen-current-time">00:00</div>
      <div id="lockscreen-current-date">Monday, January 1</div>
    </header>

    <div class="lockscreen-login-card">
      <div class="user-avatar-wrapper">
        <img
          src="logo.jpg"
          alt="User Profile Avatar"
          class="user-avatar"
          onerror="this.src='https://placehold.co/90x90/090911/00f3ff?text=Z'"
        />
      </div>

      <h2 class="user-display-name">Cosmic Explorer</h2>

      <button id="unlock-system-button" class="btn-galaxy">
        <span>Enter Orbit</span>
        <i class="fa-solid fa-rocket" aria-hidden="true"></i>
      </button>
    </div>

    <footer class="lockscreen-footer">
      Zenzei OS 1.0 &bull; Press Space or Enter to wake
    </footer>
  </section>

  <!-- Main Interactive Desktop Workspace -->
  <main id="desktop-workspace" class="hidden">

    <!-- Primary Desktop App Shortcuts -->
    <section class="desktop-shortcuts" aria-label="Desktop Shortcuts">

      <button class="shortcut-item" data-app-id="terminal">
        <div class="shortcut-icon-wrapper terminal-theme">
          <i class="fa-solid fa-terminal" aria-hidden="true"></i>
        </div>
        <span class="shortcut-label">Cosmic Terminal</span>
      </button>

      <button class="shortcut-item" data-app-id="notes">
        <div class="shortcut-icon-wrapper notes-theme">
          <i class="fa-regular fa-clipboard" aria-hidden="true"></i>
        </div>
        <span class="shortcut-label">Nebula Notes</span>
      </button>

      <button class="shortcut-item" data-app-id="asteroids">
        <div class="shortcut-icon-wrapper game-theme">
          <i class="fa-solid fa-meteor" aria-hidden="true"></i>
        </div>
        <span class="shortcut-label">Cosmic Asteroids</span>
      </button>

      <button class="shortcut-item" data-app-id="draw">
        <div class="shortcut-icon-wrapper draw-theme">
          <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
        </div>
        <span class="shortcut-label">Stellar Draw</span>
      </button>

      <button class="shortcut-item" data-app-id="explorer">
        <div class="shortcut-icon-wrapper explorer-theme">
          <i class="fa-solid fa-user-astronaut" aria-hidden="true"></i>
        </div>
        <span class="shortcut-label">Space Explorer</span>
      </button>

      <button class="shortcut-item" data-app-id="settings">
        <div class="shortcut-icon-wrapper settings-theme">
          <i class="fa-solid fa-sliders" aria-hidden="true"></i>
        </div>
        <span class="shortcut-label">Orion Control</span>
      </button>

    </section>

    <!-- Container where active application windows are dynamically injected -->
    <div id="active-windows-container"></div>

    <!-- System Taskbar -->
    <footer id="system-taskbar">

      <button id="start-menu-toggle-button">
        <img
          src="logo.jpg"
          alt="Start Menu Icon"
          class="start-btn-logo"
          onerror="this.src='https://placehold.co/20x20/090911/00f3ff?text=Z'"
        />
        <span class="start-btn-text">START</span>
      </button>

      <!-- Taskbar tabs for open windows -->
      <div id="active-apps-taskbar-container"></div>

      <!-- System Tray (Sound, Clock, Indicators) -->
      <div class="system-tray">
        <button id="audio-toggle-button" class="tray-icon-button" title="Toggle Audio Feedback">
          <i class="fa-solid fa-volume-high" aria-hidden="true"></i>
        </button>

        <div class="tray-divider"></div>

        <time id="system-tray-clock" class="tray-clock">00:00:00</time>
      </div>

    </footer>

    <!-- Start Launcher Menu -->
    <nav id="start-menu-launcher" class="hidden" aria-label="Start Menu">

      <aside class="start-menu-sidebar">
        <div class="start-sidebar-user">
          <img
            src="logo.jpg"
            alt="User Avatar"
            class="start-avatar"
            onerror="this.src='https://placehold.co/64x64/090911/00f3ff?text=Z'"
          />
          <div class="start-username">Cosmic Explorer</div>
          <div class="start-user-status">
            <i class="fa-solid fa-circle text-green"></i>
            <span>Online</span>
          </div>
        </div>

        <div class="start-sidebar-links">
          <button class="start-sidebar-item" data-action="open-app" data-app-id="settings">
            <i class="fa-solid fa-sliders" aria-hidden="true"></i> Settings
          </button>
          <button class="start-sidebar-item" data-action="open-app" data-app-id="explorer">
            <i class="fa-solid fa-user-astronaut" aria-hidden="true"></i> Space Explorer
          </button>
        </div>

        <!-- Power Management Actions -->
        <div class="start-sidebar-actions">
          <button id="lock-system-button" class="btn-start-action" title="Lock Desktop">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
          </button>
          <button id="restart-system-button" class="btn-start-action" title="Restart System">
            <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
          </button>
          <button id="shutdown-system-button" class="btn-start-action" title="Shut Down System">
            <i class="fa-solid fa-power-off" aria-hidden="true"></i>
          </button>
        </div>
      </aside>

      <section class="start-menu-main">
        <h3 class="start-section-title">Applications</h3>

        <div class="start-apps-grid">
          <!-- Dynamically populated app grid cards -->
        </div>

        <!-- Simulated Real-time System Metrics -->
        <div class="start-system-stats">
          <div class="start-stat-item">
            <span class="system-stat-label">CPU</span>
            <div class="stat-progress-bar">
              <div id="cpu-usage-progress-bar"></div>
            </div>
          </div>

          <div class="start-stat-item">
            <span class="system-stat-label">RAM</span>
            <div class="stat-progress-bar">
              <div id="ram-usage-progress-bar"></div>
            </div>
          </div>
        </div>
      </section>

    </nav>

  </main>

  <!-- System Shutdown & Restart Transition Overlay -->
  <section id="shutdown-screen" class="system-overlay hidden">
    <div class="shutdown-content">
      <div class="shutdown-icon-animate">
        <i class="fa-solid fa-power-off" aria-hidden="true"></i>
      </div>
      <h2 id="shutdown-status-text">Shutting down...</h2>
      <p>Please wait a moment.</p>
    </div>
  </section>

  <!-- Load JavaScript core application logic -->
  <script src="app.js"></script>

</body>
</html>
